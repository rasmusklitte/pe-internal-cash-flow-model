[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prognosemodel"
version = "0.1.0"
description = "Cash flow-prognose for en investors alternative investeringer som PowerPoint på PPIM-slidemasteren"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "pyodbc",
    "python-pptx",
    "PyYAML",
    "SQLAlchemy>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
prognosemodel = "prognosemodel.cli:main"

[tool.setuptools]
packages = ["prognosemodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: læser databasen; fravælg med -m \"not db\""]

[tool.ruff]
line-length = 100
# style.py and deck.py are shared house-style modules, kept identical to the other PE repos
extend-exclude = ["prognosemodel/style.py", "prognosemodel/deck.py"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "PLE", "RUF034"]
ignore = ["E731", "B905"]
